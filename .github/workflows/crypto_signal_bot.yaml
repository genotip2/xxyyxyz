name: Crypto Signal Bot

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests tradingview-ta

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_signal_bot.py

      - name: Check for changes and commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 🛡️ Tambahkan file JSON hanya jika file tersebut ada
          for f in active_buys.json pairs_cache.json cooldowns.json btc_dominance.json; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "✅ Added: $f"
            else
              echo "⏭️ Skipped (not found): $f"
            fi
          done
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update bot state [skip ci]"
            git push
          fi
